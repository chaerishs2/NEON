<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEON 환자</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-200 flex justify-center">
  <div class="w-full max-w-md bg-white flex flex-col h-dvh shadow-lg">
    <header class="bg-teal-600 text-white p-3">
      <div class="flex items-center justify-between">
        <span class="font-bold tracking-wide">NEON</span>
        <select id="patient" class="text-slate-800 rounded px-2 py-1 text-sm"></select>
      </div>
      <div id="room" class="text-xs text-teal-100 mt-1"></div>
    </header>

    <div id="conn" class="hidden bg-amber-500 text-white text-center text-sm py-1">서버와 연결이 끊겼어요. 다시 연결하는 중…</div>
    <div id="status" class="px-3 pt-2 empty:hidden"></div>
    <div id="visit" class="px-3 pt-2 empty:hidden"></div>

    <main id="chat" class="flex-1 overflow-y-auto p-3 space-y-3 bg-slate-50"></main>

    <div id="err" class="px-3 py-1 text-sm text-red-600 empty:hidden"></div>
    <form id="form" class="p-3 border-t flex gap-2">
      <input id="text" autocomplete="off" placeholder="궁금한 점을 말씀해 주세요"
        class="flex-1 border rounded-full px-4 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
      <button id="mic" type="button" aria-label="음성으로 입력" class="border rounded-full w-11 h-11 flex items-center justify-center text-slate-600">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <button class="bg-teal-600 text-white rounded-full px-5 py-2 font-medium disabled:opacity-40">전송</button>
    </form>
  </div>

  <script src="common.js"></script>
  <script>
    const STATUS = {
      processing: ["AI가 확인하고 있어요…", "bg-slate-100 text-slate-600"],
      answered_by_ai: ["AI가 답변했어요", "bg-teal-50 text-teal-700"],
      pending_nurse: ["간호사 확인을 기다리고 있어요", "bg-amber-50 text-amber-700"],
      responded: ["간호사가 답변했어요", "bg-blue-50 text-blue-700"],
      handled_directly: ["간호사가 직접 도와드려요", "bg-blue-50 text-blue-700"],
      emergency: ["긴급 호출됨 · 의료진이 오고 있어요", "bg-red-100 text-red-700 font-semibold animate-pulse"],
      emergency_acknowledged: ["의료진이 확인했어요", "bg-green-50 text-green-700"],
    };
    const SENDER = {
      patient: ["self-end bg-teal-600 text-white", ""],
      ai: ["self-start bg-white border text-slate-800", "AI 도우미"],
      nurse: ["self-start bg-blue-50 border border-blue-200 text-slate-800", "간호사"],
      system: ["self-center bg-slate-200 text-slate-600 text-sm", ""],
    };

    const sel = $("#patient");
    const chat = $("#chat");
    let pid, lastJson = "";

    function render(d) {
      $("#room").textContent = d.patient.room;
      const near = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80 || !chat.children.length;
      chat.innerHTML = d.messages.map((m) => {
        const [cls, label] = SENDER[m.sender] || SENDER.system;
        return `<div class="flex flex-col ${m.sender === "patient" ? "items-end" : m.sender === "system" ? "items-center" : "items-start"}">
          ${label ? `<span class="text-xs text-slate-500 mb-0.5">${label}</span>` : ""}
          <div class="${cls} max-w-[85%] rounded-2xl px-3 py-2 whitespace-pre-wrap">${esc(m.text)}</div>
          <span class="text-[11px] text-slate-400 mt-0.5">${fmtTime(m.created_at)}</span></div>`;
      }).join("");
      if (near) chat.scrollTop = chat.scrollHeight;

      const l = d.latest;
      const st = l && STATUS[l.status];
      $("#status").innerHTML = st ? `<div class="rounded-lg px-3 py-2 text-sm ${st[1]}">${st[0]}</div>` : "";
      const showVisit = l && l.visit.needed && (l.status === "responded" || l.status === "handled_directly");
      $("#visit").innerHTML = showVisit
        ? `<div class="rounded-lg border-2 border-blue-400 bg-blue-50 px-3 py-3 text-blue-900 text-center">
             <div class="text-sm">간호사 방문 예정</div>
             <div class="text-2xl font-bold">${l.visit.eta_min ? `약 ${esc(l.visit.eta_min)}분 안에` : "곧 찾아와요"}</div></div>`
        : "";
    }

    async function refresh() {
      const mine = pid;
      const d = await api("GET", "/api/requests?patient_id=" + encodeURIComponent(mine));
      if (mine !== pid) return;
      const j = JSON.stringify(d);
      if (j === lastJson) return;
      lastJson = j;
      render(d);
    }
    const pollMs = () => (lastJson.includes('"status":"processing"') ? 700 : 2000);

    let voice = false;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      $("#mic").remove();
    } else {
      const rec = new SR();
      rec.lang = "ko-KR";
      rec.interimResults = true;
      let listening = false;
      const mic = $("#mic");
      const setListening = (on) => {
        listening = on;
        mic.classList.toggle("bg-red-500", on);
        mic.classList.toggle("text-white", on);
        mic.classList.toggle("animate-pulse", on);
      };
      rec.onstart = () => setListening(true);
      rec.onend = () => setListening(false);
      rec.onresult = (e) => {
        $("#text").value = [...e.results].map((r) => r[0].transcript).join("");
        voice = true;
      };
      rec.onerror = (e) => {
        const reason = {
          "not-allowed": "마이크 권한이 필요해요",
          "service-not-allowed": "이 브라우저에서는 음성 인식을 쓸 수 없어요. Chrome이나 Edge에서 열어 주세요",
          "no-speech": "음성이 들리지 않았어요",
          "audio-capture": "마이크를 찾을 수 없어요",
          network: "음성 인식 서버에 연결할 수 없어요. 인터넷을 확인하거나 Chrome/Edge에서 열어 주세요",
        }[e.error];
        $("#err").textContent = reason || `음성 인식에 실패했어요 (${e.error})`;
      };
      mic.onclick = () => {
        $("#err").textContent = "";
        if (listening) rec.stop();
        else rec.start();
      };
    }

    $("#form").onsubmit = async (e) => {
      e.preventDefault();
      const input = $("#text");
      const text = input.value.trim();
      if (!text) return;
      const type = voice ? "voice" : "text";
      input.value = "";
      voice = false;
      $("#err").textContent = "";
      try {
        await api("POST", "/api/requests", { patient_id: pid, text, input_type: type });
      } catch (err) {
        input.value = text;
        voice = type === "voice";
        $("#err").textContent = "전송하지 못했어요: " + err.message;
        return;
      }
      refresh();
    };

    (async () => {
      const ps = await api("GET", "/api/patients");
      sel.innerHTML = ps.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
      pid = localStorage.getItem("neon_pid");
      if (!ps.some((p) => p.id === pid)) pid = ps[0].id;
      sel.value = pid;
      sel.onchange = () => {
        pid = sel.value;
        localStorage.setItem("neon_pid", pid);
        lastJson = "";
        chat.innerHTML = "";
        refresh();
      };
      poll(refresh, pollMs);
    })();
  </script>
</body>
</html>
